<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Random Color Generator</h1>

        <button id="theme-btn">🌙 Dark Mode</button>

        <div class="color-box"></div>

        <h2 id="color-code">#FFFFFF</h2>

        <button id="btn">Generate Color</button>
        <button id="copy-btn">Copy Color Code</button>

        <h3>Recent Colors</h3>

        <div id="history"></div>
    </div>

    <div id="toast">Color Code Copied!</div>

    <script src="script.js"></script>

</body>
</html>
